name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'claude/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.7.1'

jobs:
  # ============================================================================
  # Code Quality Checks
  # ============================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [formatting, linting, type-checking]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check code formatting (Black)
        if: matrix.check == 'formatting'
        run: |
          black --check --diff src/ tests/
          echo "✓ Black formatting check passed"

      - name: Check import sorting (isort)
        if: matrix.check == 'formatting'
        run: |
          isort --check-only --diff src/ tests/
          echo "✓ Import sorting check passed"

      - name: Lint with flake8
        if: matrix.check == 'linting'
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
          echo "✓ Flake8 linting passed"

      - name: Type check with mypy
        if: matrix.check == 'type-checking'
        run: |
          mypy src/ --install-types --non-interactive
          echo "✓ Type checking passed"

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit

      - name: Run Bandit security scan
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -ll -i
          echo "✓ Bandit security scan completed"

      - name: Check for known vulnerabilities (Safety)
        run: |
          safety check --json || true
          safety check --short-report
          echo "✓ Safety vulnerability check completed"
        continue-on-error: true

      - name: Audit dependencies (pip-audit)
        run: |
          pip-audit --desc || true
          echo "✓ Pip audit completed"
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  # ============================================================================
  # Unit Tests
  # ============================================================================
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          LANGFUSE_ENABLED: false
          LOG_LEVEL: ERROR
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=junit-report.xml \
            --maxfail=5 \
            -m "not integration"
          echo "✓ Unit tests passed"

      - name: Generate coverage report
        if: matrix.python-version == '3.11'
        run: |
          coverage report --show-missing
          coverage html

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit-report.xml
            htmlcov/
            coverage.xml
          retention-days: 30

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  # ============================================================================
  # Integration Tests
  # ============================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        env:
          LANGFUSE_ENABLED: false
          LOG_LEVEL: ERROR
        run: |
          pytest tests/test_integration.py -v -m integration || true
          echo "✓ Integration tests completed"
        continue-on-error: true

  # ============================================================================
  # Docker Build Test
  # ============================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: litellm-proxy-langfuse:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}

      - name: Test Docker image
        run: |
          docker images
          echo "✓ Docker build successful"

  # ============================================================================
  # Build Summary
  # ============================================================================
  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [code-quality, security, test, integration-test, docker]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.code-quality.result }}" == "success" ]] && \
             [[ "${{ needs.security.result }}" == "success" ]] && \
             [[ "${{ needs.test.result }}" == "success" ]] && \
             [[ "${{ needs.docker.result }}" == "success" ]]; then
            echo "✓ All CI checks passed successfully!"
            exit 0
          else
            echo "✗ Some CI checks failed"
            echo "Code Quality: ${{ needs.code-quality.result }}"
            echo "Security: ${{ needs.security.result }}"
            echo "Tests: ${{ needs.test.result }}"
            echo "Integration Tests: ${{ needs.integration-test.result }}"
            echo "Docker: ${{ needs.docker.result }}"
            exit 1
          fi
