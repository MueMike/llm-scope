name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ============================================================================
  # PR Validation
  # ============================================================================
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            proxy
            langfuse
            middleware
            config
            tests
            docker
            ci
            deps
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            starts with an uppercase letter.

      - name: Check PR description
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr.body || pr.body.trim().length < 20) {
              core.setFailed('PR description is too short. Please provide a meaningful description.');
            }

  # ============================================================================
  # Auto-label PR
  # ============================================================================
  label:
    name: Auto Label PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Label PR by size
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/xs'
          xs_max_size: 10
          s_label: 'size/s'
          s_max_size: 50
          m_label: 'size/m'
          m_max_size: 200
          l_label: 'size/l'
          l_max_size: 500
          xl_label: 'size/xl'

      - name: Label PR by files changed
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Add area labels
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const labels = new Set();

            for (const file of files) {
              if (file.filename.startsWith('src/proxy/')) labels.add('area/proxy');
              if (file.filename.startsWith('src/integrations/')) labels.add('area/integrations');
              if (file.filename.startsWith('src/config/')) labels.add('area/config');
              if (file.filename.startsWith('tests/')) labels.add('area/tests');
              if (file.filename.startsWith('docker/')) labels.add('area/docker');
              if (file.filename.startsWith('.github/')) labels.add('area/ci-cd');
              if (file.filename.includes('README') || file.filename.endsWith('.md')) labels.add('area/docs');
              if (file.filename === 'requirements.txt' || file.filename === 'pyproject.toml') labels.add('dependencies');
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: Array.from(labels),
              });
            }

  # ============================================================================
  # Code Coverage Comparison
  # ============================================================================
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          LANGFUSE_ENABLED: false
        run: |
          pytest tests/ -v --cov=src --cov-report=json --cov-report=term -m "not integration"

      - name: Coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

  # ============================================================================
  # PR Summary Comment
  # ============================================================================
  pr-comment:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [pr-validation, label, coverage]
    if: always()
    steps:
      - name: Create PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const validationStatus = '${{ needs.pr-validation.result }}' === 'success' ? '✅' : '❌';
            const labelStatus = '${{ needs.label.result }}' === 'success' ? '✅' : '❌';
            const coverageStatus = '${{ needs.coverage.result }}' === 'success' ? '✅' : '⚠️';

            const comment = `## 🤖 PR Validation Summary

            | Check | Status |
            |-------|--------|
            | PR Validation | ${validationStatus} |
            | Auto-labeling | ${labelStatus} |
            | Code Coverage | ${coverageStatus} |

            ### 📊 PR Details
            - **Branch**: \`${pr.head.ref}\` → \`${pr.base.ref}\`
            - **Commits**: ${pr.commits}
            - **Files Changed**: ${pr.changed_files}
            - **Additions**: +${pr.additions}
            - **Deletions**: -${pr.deletions}

            ### 🔍 Next Steps
            - Ensure all CI checks pass
            - Request reviews from maintainers
            - Address any feedback

            ---
            *This comment was auto-generated by the PR validation workflow*
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('PR Validation Summary')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment,
              });
            }

  # ============================================================================
  # Check for Breaking Changes
  # ============================================================================
  breaking-changes:
    name: Check Breaking Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for breaking changes
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title.toLowerCase();
            const body = (pr.body || '').toLowerCase();

            const breakingKeywords = ['breaking', 'breaking change', 'bc:', 'breaking:'];
            const hasBreaking = breakingKeywords.some(keyword =>
              title.includes(keyword) || body.includes(keyword)
            );

            if (hasBreaking) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['breaking-change'],
              });

              core.warning('This PR contains breaking changes!');
            }
