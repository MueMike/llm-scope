name: Nightly Build

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  nightly-build:
    name: Nightly Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run comprehensive tests
        env:
          LANGFUSE_ENABLED: false
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term \
            --cov-report=html \
            --cov-report=xml \
            --maxfail=0
        continue-on-error: true

      - name: Run curl integration tests
        run: |
          # Start server in background
          python main.py &
          SERVER_PID=$!
          sleep 5

          # Run curl tests
          chmod +x tests/test_curl.sh
          ./tests/test_curl.sh || true

          # Cleanup
          kill $SERVER_PID || true
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-test-results-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
          retention-days: 7

  dependency-check:
    name: Check for Outdated Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-check

      - name: Check for outdated packages
        run: |
          pip list --outdated
          pip-check || true
        continue-on-error: true

  docker-nightly:
    name: Docker Nightly Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nightly image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:nightly
            ghcr.io/${{ github.repository }}:nightly-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  report:
    name: Send Nightly Report
    runs-on: ubuntu-latest
    needs: [nightly-build, dependency-check, docker-nightly]
    if: always()
    steps:
      - name: Create report
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = '${{ needs.nightly-build.result }}';
            const depsStatus = '${{ needs.dependency-check.result }}';
            const dockerStatus = '${{ needs.docker-nightly.result }}';

            const report = `
            ## 🌙 Nightly Build Report

            **Date**: ${new Date().toISOString().split('T')[0]}

            | Job | Status |
            |-----|--------|
            | Build & Test | ${buildStatus === 'success' ? '✅' : '❌'} |
            | Dependency Check | ${depsStatus === 'success' ? '✅' : '⚠️'} |
            | Docker Build | ${dockerStatus === 'success' ? '✅' : '❌'} |

            **Workflow Run**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            `;

            console.log(report);

            // Create an issue if any job failed
            if (buildStatus !== 'success' || dockerStatus !== 'success') {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `❌ Nightly Build Failed - ${new Date().toISOString().split('T')[0]}`,
                body: report,
                labels: ['nightly-build', 'automated', 'bug']
              });
            }
